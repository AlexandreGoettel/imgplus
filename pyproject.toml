[project]
name = "imgplus"
version = "0.1.2"
description = "Self-regenerating editable plots."
authors = [
    {name = "Alexandre Göttel", email = "alexgoettel@live.de"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pypdf>=4.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.0.0",
    "twine>=7.0.0",
]

[project.urls]
Repository = "https://github.com/AlexandreGoettel/imgplus"
